name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the job that actually publishes asks for more.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Blocks the deploy if a credential-looking string, an external script
  # reference, or an unsafe JS construct is about to be published.
  audit:
    runs-on: ubuntu-latest
    # Includes a shallow clone of IPA-Audio (~305 MB) for the audio gate.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Security audit
        run: python3 tools/security_audit.py

      - name: Launch lint (language, icons, structural guarantees)
        run: python3 tools/launch_lint.py

      - name: Dialect lint (inventories, transcription systems, notation)
        run: python3 tools/dialect_lint.py

      - name: Credential scan (working tree + full git history)
        run: python3 tools/scan_secrets.py --worktree --history

      # Audio lives in its own repository (IPA-Audio) since 2026-09-21, but
      # the app still must not deploy against an index that disagrees with
      # the files or the quality flags. Checked out LAST, after every scanner
      # above has run, so none of them walks 9,000 audio files by accident.
      - name: Checkout audio (IPA-Audio)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: frankierocco3-coder/IPA-Audio
          path: IPA-Audio
          fetch-depth: 1
          persist-credentials: false

      - name: Audio integrity (index ↔ files ↔ quality flags)
        env:
          SPEECHCRAFT_AUDIO_DIR: ${{ github.workspace }}/IPA-Audio
        run: python3 tools/audit_audio.py

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    # Pages re-publishes the WHOLE site each time (hundreds of MB of audio),
    # and its publish step alone ran past 10 minutes on 2026-09-21, which
    # cancelled a deploy that had passed every check. 20 leaves headroom.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read      # read the repository being published
      actions: read       # read THIS run's artifact list, for the wait below
      pages: write        # create and publish the Pages deployment
      id-token: write     # OIDC token that deploy-pages exchanges with Pages
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1              # no history needed to publish
          persist-credentials: false  # don't leave a usable token on disk

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      # Publish an allow-listed build, not the whole repository. This keeps
      # tools/, docs/, tests/ and .github/ off the public site, and makes it
      # structurally impossible for a stray credential file to be served.
      - name: Build deploy artifact
        run: python3 tools/build_artifact.py _site

      - name: Scan the exact files about to be published
        run: python3 tools/scan_secrets.py --artifact _site

      # PINNED TO THE v5 LINE ON 2026-11-22. The bump is worth having and
      # it is NOT the fix for the failure that prompted it. Read the
      # correction below before repeating my reasoning.
      #
      # THE FAILURE. The Deploy step fails with
      #
      #     Error: No artifacts named "github-pages" were found for this
      #     workflow run.
      #
      # while the same run page lists artifact github-pages at 44.1 MB.
      # The audit job passes, build and upload pass, and 44 MB is a
      # twentieth of the 1 GB Pages limit.
      #
      # WHAT I CONCLUDED, AND WHY IT WAS WRONG. Two consecutive failures
      # on 2026-11-22 followed a long run of successes, this file had not
      # changed since 2026-09-21, githubstatus was clean, and the run's own
      # annotation said these actions "target Node.js 20 but are being
      # forced to run on Node.js 24". deploy-pages v5.0.0 exists precisely
      # to move to Node 24, so version drift looked like the cause and the
      # next two deploys passed, which looked like proof. It was not.
      # Measured over the eight runs either side of the bump:
      #
      #     2026-11-20  success   old pins   x3
      #     2026-11-22  failure   old pins   x2
      #     2026-11-22  success   NEW pins   x2
      #     2026-11-23  failure   NEW pins
      #
      # The same failure happens on the current pins and the old pins
      # succeeded for weeks, so the bump neither caused it nor cured it.
      # Two failures in a row made an intermittent fault look structural,
      # and two successes after a change made the change look like the
      # remedy. The run's THIRD annotation says what it actually is, and
      # it was there from the first failure: "Fetching artifact metadata
      # failed ... Please re-run the deployment at a later time."
      #
      # WHAT TO DO WHEN IT HAPPENS: PUSH AGAIN. DO NOT RE-RUN THE JOB.
      #
      # This is the part that cost the most to learn, on 2026-11-23, and
      # the action's own message sends you the wrong way. There are TWO
      # different failures here and they read almost alike:
      #
      #   count 0  "No artifacts named github-pages were found"
      #            The lookup ran before the upload was visible to the
      #            artifact API, even though the Upload step passed and
      #            the artifact is listed on the run page. This is the
      #            intermittent one.
      #
      #   count 2  "Multiple artifacts named github-pages were
      #            unexpectedly found ... Artifact count is 2."
      #            SELF INFLICTED. Re-running the deploy job uploads a
      #            SECOND artifact under the same name into the same run,
      #            and deploy-pages requires exactly one. A re-run of this
      #            job therefore CANNOT succeed, whatever the original
      #            failure was, and it turns a transient fault into a
      #            permanent one for that run.
      #
      # So "Please re-run the deployment at a later time", which the action
      # prints on both, is advice this workflow cannot take. A new push
      # gives a new run and a clean artifact namespace, which is the only
      # retry that works. Read the Deploy step's log for the count line
      # before doing anything: `Found N artifact(s)` names which failure
      # you have.
      #
      # Do not change this file looking for a cause in it. Check the run
      # list too: an intermittent failure sits among successes on the same
      # pins, and a real break fails every time.
      #
      # SINCE 2026-11-24 THERE IS A GUARD, and it is a step rather than a
      # change to these pins: "Wait for the artifact to be readable",
      # below, between the upload and the Deploy that races it. Read its
      # note before concluding anything from a failure here, because a
      # count-0 Deploy failure now means the artifact was unreadable for
      # 150 seconds, which is a different and much larger claim than the
      # one-second race this paragraph was written about.
      #
      # actions/checkout and actions/configure-pages still carry the Node
      # 20 warning and are deliberately NOT bumped. Their steps pass, and
      # after the above I am not going to claim that bumping them fixes
      # anything.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # ── THE ARTIFACT HAS TO BE READABLE BEFORE DEPLOY LOOKS FOR IT ──
      #
      # Added 2026-11-24, after the failure described at length above
      # took two pushes in a row. Everything in that note still holds;
      # this is the guard it did not have.
      #
      # WHAT WAS MEASURED, on both of that day's failures: the artifact's
      # `created_at` is the SAME SECOND the Deploy step starts, and
      # Deploy is over one second later with count 0. deploy-pages reads
      # the artifact metadata once, immediately, with no retry, so the
      # upload finishing and the artifact being READABLE are two
      # different moments and the action assumes they are one. Six of
      # the fourteen deploys before it died exactly there, scattered
      # among successes on these pins, with githubstatus clean.
      #
      # A POLL, NOT A `sleep`. The right wait is however long the index
      # actually takes, which is not a number anyone here knows; and a
      # count of 2 is the OTHER failure in the note above, which a sleep
      # would hide for another second and then hand to deploy-pages as
      # an unretryable error. This asks for the precondition in one
      # line — exactly one artifact by that name, visible to the API
      # deploy-pages is about to ask — and says which failure it has.
      #
      # IT DOES NOT REPLACE "PUSH AGAIN". A run that has already failed
      # still cannot be re-run, for the reason given above.
      - name: Wait for the artifact to be readable
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ARTIFACTS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          # `|| true` BECAUSE THIS SHELL RUNS UNDER `set -eo pipefail`
          # (the job's `defaults: run: shell: bash`). Without it a single
          # failed API call aborts the step at the assignment, which
          # would trade one intermittent failure for another — and this
          # step exists to survive exactly that kind of blip.
          for i in $(seq 1 30); do
            n=$(gh api "$RUN_ARTIFACTS?name=github-pages" --jq '.total_count' || true)
            case "$n" in
              1) echo "attempt $i: readable after $(( (i - 1) * 5 ))s"; exit 0 ;;
              0) echo "attempt $i: not readable yet"; sleep 5 ;;
              # Empty or non-numeric is the API not answering, NOT a
              # verdict about the artifact. It must be its own branch and
              # it must come before the catch-all, or it reads as a count
              # and fails the deploy on a blip.
              ''|*[!0-9]*) echo "attempt $i: could not read the artifact list, retrying"; sleep 5 ;;
              *) echo "::error::Artifact count is $n, and deploy-pages requires exactly one. A re-run of this job uploads a second artifact under the same name; push a new commit instead."
                 exit 1 ;;
            esac
          done
          echo "::error::The github-pages artifact was still not readable after 150s. This is the count-0 failure described in this file: push again rather than re-running the job."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
