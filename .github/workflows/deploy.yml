name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the job that actually publishes asks for more.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Blocks the deploy if a credential-looking string, an external script
  # reference, or an unsafe JS construct is about to be published.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Security audit
        run: python3 tools/security_audit.py

      - name: Credential scan (working tree + full git history)
        run: python3 tools/scan_secrets.py --worktree --history

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read      # read the repository being published
      pages: write        # create and publish the Pages deployment
      id-token: write     # OIDC token that deploy-pages exchanges with Pages
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1              # no history needed to publish
          persist-credentials: false  # don't leave a usable token on disk

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      # Publish an allow-listed build, not the whole repository. This keeps
      # tools/, docs/, tests/ and .github/ off the public site, and makes it
      # structurally impossible for a stray credential file to be served.
      - name: Build deploy artifact
        run: python3 tools/build_artifact.py _site

      - name: Scan the exact files about to be published
        run: python3 tools/scan_secrets.py --artifact _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
