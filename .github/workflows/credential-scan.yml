name: Credential scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'   # weekly: catches a key added by any route

# Read-only. This workflow needs no secrets and is given none, so a
# malicious PR cannot exfiltrate anything through it.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history — a deleted key still counts
          persist-credentials: false

      # The scanner is local Python with no dependencies: repository contents
      # are never uploaded to a third-party service.
      - name: Scan working tree and complete git history
        run: python3 tools/scan_secrets.py --worktree --history

      - name: Build and scan the deploy artifact
        run: |
          python3 tools/build_artifact.py _site
          python3 tools/scan_secrets.py --artifact _site

      - name: Static security audit
        run: python3 tools/security_audit.py
