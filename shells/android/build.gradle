// Module-level Gradle for the Android shell.
//
// This is the whole dependency list, and it is one line: androidx.webkit,
// for WebViewAssetLoader. No Node, no npm, no package.json — hard
// constraint 1 in CLAUDE.md survives going native, which is why the
// shells are hand-written rather than generated by Capacitor.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.speechcraft.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.speechcraft.app"
        minSdk 24               // WebViewAssetLoader needs 21; 24 is a sane floor
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false     // nothing to shrink: the app is web assets
            signingConfig signingConfigs.debug   // REPLACE before publishing
        }
    }

    // The payload is ~108MB of already-compressed mp3 and jpeg. Letting
    // Gradle compress it again costs build time and install size for
    // nothing, and compressed assets cannot be read with a direct offset.
    androidResources {
        noCompress += ['mp3', 'jpg', 'jpeg', 'png', 'webp', 'woff2']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
}
