<!doctype html><html><head><meta charset="utf-8"><title>Rhythm diagrams</title>
<style>
 body{background:#efe9dc;color:#2f3a2e;font:14px/1.5 Georgia,serif;margin:0;padding:18px 24px}
 h1{font-size:17px;margin:0 0 12px}
 figure{margin:0 0 20px;max-width:900px}
 img{width:100%;height:auto;display:block}
 figcaption{font-size:12px;color:#625f4c;margin-top:4px}
</style></head><body>
<h1>Tempo-Rhythm diagrams, at the width the content column gives them</h1>
<div id="o"></div>
<script>
const D=['rhythm-dials','rhythm-two','rhythm-harmony','rhythm-rests','rhythm-speeds'];
o.innerHTML=D.map(n=>`<figure><img src="../img/lessons/${n}.svg" alt=""><figcaption>${n}</figcaption></figure>`).join('');
</script></body></html>
