<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" fill="none">
<text x="60" y="70" font-family="Georgia, serif" font-size="38" fill="#3f4a38" text-anchor="start" font-weight="600">Harmony, not unison</text>
<text x="60" y="108" font-family="Georgia, serif" font-size="25" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">Two people in a scene are two lines sounding at once.</text>
<rect x="70" y="150" width="490" height="340" rx="12" fill="none" stroke="#7b8470" stroke-width="1.2" stroke-opacity=".5"/>
<text x="96" y="196" font-family="Georgia, serif" font-size="24" fill="#3f4a38" text-anchor="start" font-weight="600" letter-spacing="3">UNISON</text>
<text x="96" y="228" font-family="Georgia, serif" font-size="21" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">one note, louder</text>
<rect x="98" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="165.34" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="232.69" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="300.03" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="367.38" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="434.72" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="502.07" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="98" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="165.34" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="232.69" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="300.03" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="367.38" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="434.72" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="502.07" y="392" width="29.93" height="28" rx="2" fill="#6f8056"/>
<text x="98" y="262" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal">A</text>
<text x="98" y="380" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal">B</text>
<text x="534" y="466" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="end" font-weight="normal">nothing between them to hear</text>
<rect x="640" y="150" width="490" height="340" rx="12" fill="none" stroke="#7b8470" stroke-width="1.2" stroke-opacity=".5"/>
<text x="666" y="196" font-family="Georgia, serif" font-size="24" fill="#3f4a38" text-anchor="start" font-weight="600" letter-spacing="3">HARMONY</text>
<text x="666" y="228" font-family="Georgia, serif" font-size="21" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">two lines, and the intervals between them</text>
<rect x="668" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="735.34" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="802.69" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="870.03" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="937.38" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="1004.72" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="1072.07" y="274" width="29.93" height="28" rx="2" fill="#6f8056"/>
<rect x="668" y="392" width="19.46" height="28" rx="2" fill="#b45c42"/>
<rect x="705.41" y="392" width="44.9" height="28" rx="2" fill="#b45c42"/>
<rect x="772.76" y="392" width="22.45" height="28" rx="2" fill="#b45c42"/>
<rect x="843.1" y="392" width="37.41" height="28" rx="2" fill="#b45c42"/>
<rect x="895.48" y="392" width="11.97" height="28" rx="2" fill="#b45c42"/>
<rect x="944.86" y="392" width="52.38" height="28" rx="2" fill="#b45c42"/>
<rect x="1012.21" y="392" width="14.97" height="28" rx="2" fill="#b45c42"/>
<text x="668" y="262" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal">A</text>
<text x="668" y="380" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal">B</text>
<line x1="677.73" y1="306" x2="677.73" y2="388" stroke="#b08a35" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".75"/>
<line x1="727.86" y1="306" x2="727.86" y2="388" stroke="#b08a35" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".75"/>
<line x1="783.98" y1="306" x2="783.98" y2="388" stroke="#b08a35" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".75"/>
<line x1="861.8" y1="306" x2="861.8" y2="388" stroke="#b08a35" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".75"/>
<line x1="901.46" y1="306" x2="901.46" y2="388" stroke="#b08a35" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".75"/>
<text x="1104" y="466" font-family="Georgia, serif" font-size="20" fill="#b08a35" text-anchor="end" font-weight="normal">the intervals, which neither actor plays</text>
<text x="60" y="568" font-family="Georgia, serif" font-size="25" fill="#3f4a38" text-anchor="start" font-weight="normal">Two players on the same note are not making a chord. They are making one note louder.</text>
<text x="60" y="610" font-family="Georgia, serif" font-size="23" fill="#7b8470" text-anchor="start" font-weight="normal">What to fear is accidental unison: a scene rehearsed until everybody has drifted onto one polite shared pace.</text>
</svg>
