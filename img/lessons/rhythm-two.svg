<text x="284" y="366" font-family="Georgia, serif" font-size="23" fill="#b08a35" text-anchor="end" font-weight="normal">the gap</text>
<text x="60" y="604" font-family="Georgia, serif" font-size="25" fill="#3f4a38" text-anchor="start" font-weight="normal">The audience is reading the distance between the two lines, not either line on its own.</text>
<text x="60" y="646" font-family="Georgia, serif" font-size="23" fill="#7b8470" text-anchor="start" font-weight="normal">Clamp the outside harder and the inside runs faster. That loop is the thing to play, not to solve.</text>
