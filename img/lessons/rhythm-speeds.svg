<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
<text x="60" y="70" font-family="Georgia, serif" font-size="38" fill="#3f4a38" text-anchor="start" font-weight="600">The two missing speeds</text>
<text x="60" y="108" font-family="Georgia, serif" font-size="25" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">Most stage speech lives in the middle. The two ends have to be built.</text>
<rect x="90" y="180" width="1020" height="54" rx="8" fill="none" stroke="#7b8470" stroke-width="1.4"/>
<rect x="375.6" y="180" width="448.8" height="54" rx="8" fill="#6f8056" fill-opacity=".28"/>
<text x="600" y="216" font-family="Georgia, serif" font-size="23" fill="#3f4a38" text-anchor="middle" font-weight="normal">where almost all stage speech sits</text>
<text x="232.8" y="216" font-family="Georgia, serif" font-size="23" fill="#b45c42" text-anchor="middle" font-weight="normal" letter-spacing="2">missing</text>
<text x="967.2" y="216" font-family="Georgia, serif" font-size="23" fill="#b45c42" text-anchor="middle" font-weight="normal" letter-spacing="2">missing</text>
<text x="90" y="272" font-family="Georgia, serif" font-size="21" fill="#7b8470" text-anchor="start" font-weight="normal" letter-spacing="2">TRUE SLOW</text>
<text x="1110" y="272" font-family="Georgia, serif" font-size="21" fill="#7b8470" text-anchor="end" font-weight="normal" letter-spacing="2">TRUE FAST</text>
<text x="90" y="330" font-family="Georgia, serif" font-size="26" fill="#3f4a38" text-anchor="start" font-weight="600">True slow</text>
<text x="90" y="360" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">the sound carries all the way through</text>
<rect x="560" y="308" width="121.19" height="26" rx="2" fill="#6f8056"/>
<rect x="690.51" y="308" width="139.83" height="26" rx="2" fill="#6f8056"/>
<rect x="839.66" y="308" width="102.54" height="26" rx="2" fill="#6f8056"/>
<rect x="951.53" y="308" width="158.47" height="26" rx="2" fill="#6f8056"/>
<text x="90" y="450" font-family="Georgia, serif" font-size="26" fill="#3f4a38" text-anchor="start" font-weight="600">Stretched slow</text>
<text x="90" y="480" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">words with air between them, and the</text>
<text x="90" y="505" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">line dies in the gaps</text>
<rect x="560" y="428" width="59.64" height="26" rx="2" fill="#b45c42"/>
<rect x="725.66" y="428" width="46.39" height="26" rx="2" fill="#b45c42"/>
<rect x="891.33" y="428" width="66.27" height="26" rx="2" fill="#b45c42"/>
<rect x="1056.99" y="428" width="53.01" height="26" rx="2" fill="#b45c42"/>
<text x="90" y="570" font-family="Georgia, serif" font-size="26" fill="#3f4a38" text-anchor="start" font-weight="600">True fast</text>
<text x="90" y="600" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">every consonant finished, built up from</text>
<text x="90" y="625" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">a crawl</text>
<rect x="560" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="595.2" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="630.4" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="665.6" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="700.8" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="736" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="771.2" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="806.4" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="841.6" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="876.8" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="912" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="947.2" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="982.4" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="1017.6" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="1052.8" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<rect x="1088" y="548" width="22" height="26" rx="2" fill="#6f8056"/>
<text x="90" y="690" font-family="Georgia, serif" font-size="26" fill="#3f4a38" text-anchor="start" font-weight="600">Rushed</text>
<text x="90" y="720" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">the words run together and the ends fall</text>
<text x="90" y="745" font-family="Georgia, serif" font-size="20" fill="#7b8470" text-anchor="start" font-weight="normal" font-style="italic">off</text>
<rect x="560" y="668" width="105.46" height="26" rx="2" fill="#b45c42"/>
<rect x="673.57" y="668" width="154.13" height="26" rx="2" fill="#b45c42"/>
<rect x="834.19" y="668" width="73.01" height="26" rx="2" fill="#b45c42"/>
<rect x="915.31" y="668" width="194.69" height="26" rx="2" fill="#b45c42"/>
</svg>
