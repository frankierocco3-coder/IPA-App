<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Diphthongs</title>
  <desc id="description">Eight English diphthongs with example words.</desc>
  <rect width="1600" height="960" fill="#fbf4e8"/>
  <rect width="1600" height="160" fill="#222628"/>
  <rect x="72" y="52" width="12" height="56" rx="6" fill="#ef573c"/>
  <text x="112" y="99" fill="#ffffff" font-family="Arial, Helvetica Neue, sans-serif" font-size="62" font-weight="700">Diphthongs</text>

  <g font-family="Arial, Helvetica Neue, sans-serif" text-anchor="middle">
    <g transform="translate(70 210)">
